name: content-engine
label: Content Engine
kind: standalone
version: "0.1.0"
author: PXMichael
homepage: https://github.com/PXMichael/content-engine
license: MIT
description: "One long video in, a week of content out. Paste a YouTube URL, get scored 45 to 60 second clips and per-platform social copy. Live in 90 seconds, no editing software."
requires_hermes: ">=0.19"
platforms: []
provides_tools:
  - ce_fetch_transcript
  - ce_score_moments
  - ce_write_copy
  - ce_cut_clips
  - ce_run
provides_hooks: []
requires_env: []
